<!DOCTYPE html>
<html>
<head>
    <title>College Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>COLLEGE REGISTRATION FORM</h1>
    <p>Please fill in the details below</p>

    <form>
        <label>Student Name:</label>
        <input type="text" placeholder="Enter your name"
               required>

        <label>Date of Birth:</label>
        <input type="date" required>

        <label>Gender:</label>
        <select required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Email Address:</label>
        <input type="email" placeholder="Enter your email"
               required>

        <label>Mobile Number:</label>
        <input type="tel" placeholder="Enter 10-digit number"
               pattern="[0-9]{10}" required>

        <label>Address:</label>
        <textarea rows="3" placeholder="Enter your address"
                  required></textarea>

        <label>Department:</label>
        <select required>
            <option value="">Select Department</option>
            <option>Computer Science Engineering</option>
            <option>Artificial Intelligence and Machine Learning</option>
            <option>Information Technology</option>
            <option>Electronics and Communication Engineering</option>
            <option>Mechanical Engineering</option>
        </select>

        <label>Course:</label>
        <select required>
            <option value="">Select Course</option>
            <option>B.E.</option>
            <option>B.Tech.</option>
            <option>M.E.</option>
            <option>M.Tech.</option>
        </select>

        <label>Admission Year:</label>
        <input type="number" min="2020" max="2035"
               placeholder="Enter admission year" required>
        
        <label>10th Percentage:</label>  
        <input type = "number"  
                  placeholder="Enter 10th percentage"required>
        <label>12th Percentage:</label>  
        <input type = "number"
                  placeholder = "Enter 12th percentage"required>
                   
               <label>Upload Student Photo:</label>
        <input type="file" accept="image/*" required>

        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset" class="reset">Reset</button>
        </div>
    </form>
</div>

</body>
</html>
